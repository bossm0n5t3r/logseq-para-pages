name: Publish plugin

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  PLUGIN_NAME: logseq-para-pages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test

      - name: Type-check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Create plugin ZIP
        run: |
          mkdir "${PLUGIN_NAME}"
          cp README.md README.en.md LICENSE package.json index.html icon.svg "${PLUGIN_NAME}/"
          cp -R dist "${PLUGIN_NAME}/dist"
          zip -r "${PLUGIN_NAME}.zip" "${PLUGIN_NAME}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "${PLUGIN_NAME}.zip" \
            --clobber
